pairs:
  USD/INR:
    priority: 1
    enabled: true
    level: "beginner"
    display_name: "USD/INR (US Dollar / Indian Rupee) 🇺🇸🇮🇳"
    base: "USD"
    quote: "INR"
    exchange: "NSE Currency Derivatives" # VERIFY against current NSE contract specifications
    instrument_type: "futures"
    active_futures_contract: "USDINR NEAR-MONTH FUT" # VERIFY against current NSE contract specifications
    lot_size: 1000 # VERIFY against current NSE contract specifications (1000 USD per contract)
    tick_size: 0.0025 # VERIFY against current NSE contract specifications (0.25 paise = 0.0025 INR)
    price_decimals: 4
    pip_definition: 0.01 # 1 paisa = 0.01 INR
    trading_hours:
      start: "09:00" # IST
      end: "17:00"   # IST
      timezone: "Asia/Kolkata"
      days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
    provider_symbols:
      twelvedata: "USD/INR"
      yahoofinance: "USDINR=X"
      finnhub: "OANDA:USD_INR"
      alpha_vantage: "USDINR"
    sl_buffer: 0.05
    rr_ratio: 2.0
    beginner_rating: "⭐⭐⭐⭐⭐ Excellent for Beginners (Low Volatility, RBI Range Bound)"
    disclaimer: "Levels based on spot; futures may trade at a small premium/discount. Trade only via a SEBI-registered broker on NSE/BSE."

